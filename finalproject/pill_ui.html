<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PillCount AI</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:       #080c10;
    --surface:  #0e1419;
    --border:   #1a2332;
    --accent:   #00e5a0;
    --accent2:  #0090ff;
    --warn:     #ff6b35;
    --text:     #c8d8e8;
    --muted:    #4a6070;
    --card:     #111820;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.35;
    pointer-events: none;
  }

  .app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

  /* ── HEADER ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,12,16,0.85);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 100;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 1.4rem; font-weight: 800;
    letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  .logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.7); }
  }
  .header-right { display: flex; align-items: center; gap: 20px; }
  .live-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px;
    border: 1px solid var(--accent);
    font-size: 0.7rem; letter-spacing: 0.1em;
    color: var(--accent);
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }

  /* ── MAIN LAYOUT ── */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: auto 1fr;
    gap: 20px;
    padding: 24px 32px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
  }

  /* ── VIDEO PANEL ── */
  .video-panel {
    grid-row: 1 / 3;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }
  .video-panel img {
    width: 100%;
    display: block;
    min-height: 400px;
    object-fit: cover;
    background: #000;
  }
  .video-overlay {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 18px;
    background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    pointer-events: none;
  }
  .overlay-tag {
    font-size: 0.65rem; letter-spacing: 0.12em; color: var(--muted);
    text-transform: uppercase;
  }
  .fps-display {
    font-size: 0.75rem;
    color: var(--accent2);
    background: rgba(0,144,255,0.12);
    border: 1px solid rgba(0,144,255,0.3);
    padding: 3px 10px; border-radius: 4px;
  }
  .video-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 14px 18px;
    background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, transparent 100%);
    display: flex; align-items: center; gap: 10px;
    pointer-events: none;
  }
  .scan-bar {
    flex: 1; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .scan-fill {
    height: 100%; width: 60%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    animation: scan 2s ease-in-out infinite alternate;
  }
  @keyframes scan { from { width: 20%; } to { width: 90%; } }

  /* ── STAT CARDS ── */
  .stats-col { display: flex; flex-direction: column; gap: 16px; }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 22px 18px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .stat-card:hover { border-color: var(--accent); }
  .stat-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .stat-card:hover::before { opacity: 1; }

  .stat-label {
    font-size: 0.65rem; letter-spacing: 0.12em;
    color: var(--muted); text-transform: uppercase; margin-bottom: 10px;
  }
  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 3.2rem; font-weight: 800;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 30px rgba(0,229,160,0.3);
    transition: all 0.2s;
  }
  .stat-value.fps-val { color: var(--accent2); font-size: 2.4rem; }
  .stat-unit {
    font-size: 0.7rem; color: var(--muted); margin-top: 6px;
  }

  /* ── CLASS BREAKDOWN ── */
  .breakdown-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    flex: 1;
  }
  .breakdown-title {
    font-size: 0.65rem; letter-spacing: 0.12em;
    color: var(--muted); text-transform: uppercase; margin-bottom: 14px;
  }
  .class-list { display: flex; flex-direction: column; gap: 10px; }
  .class-row { display: flex; flex-direction: column; gap: 4px; }
  .class-row-header { display: flex; justify-content: space-between; }
  .class-name { font-size: 0.75rem; color: var(--text); }
  .class-count { font-size: 0.75rem; color: var(--accent); font-weight: 600; }
  .class-bar-bg {
    height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .class-bar-fill {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
  }
  .no-detections {
    font-size: 0.75rem; color: var(--muted); font-style: italic;
  }

  /* ── CONF SLIDER ── */
  .conf-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .conf-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
  .conf-label { font-size: 0.65rem; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .conf-val { font-size: 0.75rem; color: var(--accent); font-weight: 600; }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%; height: 4px;
    background: var(--border); border-radius: 2px; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(0,229,160,0.5);
    cursor: pointer;
  }

  /* ── HISTORY SPARKLINE ── */
  .history-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .history-label { font-size: 0.65rem; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
  canvas#sparkline { width: 100%; height: 60px; display: block; }

  /* ── FOOTER ── */
  footer {
    padding: 14px 32px;
    border-top: 1px solid var(--border);
    font-size: 0.65rem; color: var(--muted);
    letter-spacing: 0.06em;
    display: flex; justify-content: space-between;
  }

  /* Number pop animation */
  @keyframes pop {
    0%   { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  .pop { animation: pop 0.25s ease-out; }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      PillCount<span style="color:var(--accent)">AI</span>
    </div>
    <div class="header-right">
      <div class="live-badge"><div class="live-dot"></div>LIVE STREAM</div>
    </div>
  </header>

  <!-- MAIN -->
  <main>

    <!-- VIDEO -->
    <div class="video-panel">
      <img id="feed" src="/video_feed" alt="Camera feed"/>
      <div class="video-overlay">
        <span class="overlay-tag">Camera Feed · YOLO Detection</span>
        <span class="fps-display" id="fps-overlay">— FPS</span>
      </div>
      <div class="video-bottom">
        <div class="scan-bar"><div class="scan-fill"></div></div>
        <span style="font-size:0.65rem;color:var(--muted)">SCANNING</span>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="stats-col">

      <!-- Pill count -->
      <div class="stat-card">
        <div class="stat-label">Pills Detected</div>
        <div class="stat-value" id="pill-count">0</div>
        <div class="stat-unit">objects in frame</div>
      </div>

      <!-- FPS -->
      <div class="stat-card">
        <div class="stat-label">Frame Rate</div>
        <div class="stat-value fps-val" id="fps-val">0.0</div>
        <div class="stat-unit">frames per second</div>
      </div>

      <!-- Confidence slider -->
      <div class="conf-card">
        <div class="conf-header">
          <span class="conf-label">Confidence Threshold</span>
          <span class="conf-val" id="conf-display">0.40</span>
        </div>
        <input type="range" id="conf-slider" min="10" max="95" value="40"
               oninput="updateConf(this.value)"/>
      </div>

      <!-- Sparkline history -->
      <div class="history-card">
        <div class="history-label">Count History (60s)</div>
        <canvas id="sparkline"></canvas>
      </div>

      <!-- Class breakdown -->
      <div class="breakdown-card">
        <div class="breakdown-title">Detection Breakdown</div>
        <div class="class-list" id="class-list">
          <span class="no-detections">No detections yet</span>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <span>YOLO · ONNX Runtime · CoreML</span>
    <span id="timestamp">—</span>
  </footer>

</div>

<script>
  const pillCountEl  = document.getElementById('pill-count');
  const fpsValEl     = document.getElementById('fps-val');
  const fpsOverlay   = document.getElementById('fps-overlay');
  const classListEl  = document.getElementById('class-list');
  const confDisplay  = document.getElementById('conf-display');
  const tsEl         = document.getElementById('timestamp');
  const canvas       = document.getElementById('sparkline');
  const ctx          = canvas.getContext('2d');

  const history = [];
  const MAX_HIST = 60;
  let lastCount = -1;

  function animatePop(el) {
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }

  function drawSparkline() {
    const W = canvas.offsetWidth * devicePixelRatio;
    const H = canvas.offsetHeight * devicePixelRatio;
    canvas.width = W; canvas.height = H;
    if (history.length < 2) return;

    const max = Math.max(...history, 1);
    const step = W / (MAX_HIST - 1);

    ctx.clearRect(0, 0, W, H);

    // Gradient fill
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(0,229,160,0.35)');
    grad.addColorStop(1, 'rgba(0,229,160,0)');

    ctx.beginPath();
    history.forEach((v, i) => {
      const x = i * step;
      const y = H - (v / max) * H * 0.85 - H * 0.05;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.lineTo((history.length-1)*step, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Line
    ctx.beginPath();
    history.forEach((v, i) => {
      const x = i * step;
      const y = H - (v / max) * H * 0.85 - H * 0.05;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.strokeStyle = '#00e5a0';
    ctx.lineWidth = 2 * devicePixelRatio;
    ctx.stroke();
  }

  function renderClasses(classes) {
    const total = Object.values(classes).reduce((a,b)=>a+b, 0);
    if (total === 0) {
      classListEl.innerHTML = '<span class="no-detections">No detections</span>';
      return;
    }
    const colors = ['#00e5a0','#0090ff','#ff6b35','#b44eff','#ffbe00','#00d4d4'];
    classListEl.innerHTML = Object.entries(classes).map(([name, cnt], i) => {
      const pct = Math.round((cnt / total) * 100);
      return `
        <div class="class-row">
          <div class="class-row-header">
            <span class="class-name">${name}</span>
            <span class="class-count">${cnt}</span>
          </div>
          <div class="class-bar-bg">
            <div class="class-bar-fill" style="width:${pct}%;background:${colors[i%colors.length]}"></div>
          </div>
        </div>`;
    }).join('');
  }

  async function poll() {
    try {
      const r = await fetch('/stats');
      const d = await r.json();

      // Pill count
      if (d.pill_count !== lastCount) {
        pillCountEl.textContent = d.pill_count;
        animatePop(pillCountEl);
        lastCount = d.pill_count;
      }

      // FPS
      fpsValEl.textContent   = d.fps.toFixed(1);
      fpsOverlay.textContent = d.fps.toFixed(1) + ' FPS';

      // History
      history.push(d.pill_count);
      if (history.length > MAX_HIST) history.shift();
      drawSparkline();

      // Classes
      renderClasses(d.classes || {});

      // Timestamp
      tsEl.textContent = new Date().toLocaleTimeString();
    } catch(e) {}

    setTimeout(poll, 300);
  }

  function updateConf(val) {
    const v = val / 100;
    confDisplay.textContent = v.toFixed(2);
    fetch(`/set_conf/${v}`);
  }

  poll();
</script>
</body>
</html>
